name: CI

on:
  # One run per commit on every branch; no `pull_request`, which would double it. TESTING.md §1.
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      # Runs on one Node version only: lint results cannot differ across them,
      # and this is the job that should fail first and fastest.
      - name: Lint
        run: npm run lint
      - name: Check structure
        run: npm run check-structure
      - name: Check docs examples
        run: npm run check:docs
      - name: Check bundle size against the docs
        run: npm run size

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Build the cores the bench imports from dist
        run: npm run build --workspace @oimdb/core --workspace @oimdb/core-legacy
      - name: Copy llms.txt to static
        run: cp llms.txt website/static/llms.txt
      - name: Type-check
        run: npm --workspaces --if-present run type-check
      - name: Test
        run: npm --workspaces --if-present run test
      - name: Coverage
        if: matrix.node == 20
        run: npm run coverage
      - name: Build
        run: npm --workspaces --if-present run build
