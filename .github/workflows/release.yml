name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print the plan and publish nothing
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Install
        run: npm ci
      - name: Build the cores the bench imports from dist
        run: npm run build --workspace @oimdb/core --workspace @oimdb/core-legacy
      - name: Copy llms.txt to static
        run: cp llms.txt website/static/llms.txt
      - name: Plan against the registry
        run: node scripts/publish-bumped.mjs --dry-run
      - name: Publish what the registry does not have
        if: github.event_name == 'workflow_run' || inputs.dry-run == false
        run: node scripts/publish-bumped.mjs
